# Default configuration for brainana preprocessing pipeline
# _version is set at load time from the brainana package version (pyproject.toml).
_description: "Default configuration for brainana preprocessing pipeline"

general:
  verbose: 2  # int or bool: verbosity level (0=quiet/ERROR, 1=normal/INFO, 2=verbose/DEBUG).
  anat_only: false  # bool: process only anatomical data
  gpu_device: "auto"  # str | int: "auto", -1/"cpu" (CPU), or GPU index (0..N). Global GPU policy: main.nf reads this to decide whether GPU scheduling is enabled at all (set -1/"cpu" to force the whole pipeline onto CPU). Per-model knobs (e.g. anat.skullstripping_segmentation.fastSurferCNN.gpu_device) select a specific device within that policy; if this is set to CPU, those are effectively CPU regardless.

bids_filtering:
  subjects: null  # list of str (have to be quoted) or null: filter by subject IDs (e.g., ["01", "02"])
  sessions: null  # list of str (have to be quoted) or null: filter by session IDs (e.g., ["01", "02"])
  tasks: null  # list of str (have to be quoted) or null: filter by task names (e.g., ["rest", "task"])
  runs: null  # list of str (have to be quoted) or null: filter by run numbers (e.g., ["01", "02"])

template:
  output_space: "NMT2Sym:res-05"  # str: template space in format "TEMPLATE_NAME:[:DESCRIPTION]" (e.g., "NMT2Sym:res-1", "T1w")
  # description: "Template space specification in format TEMPLATE_NAME:[:DESCRIPTION]"
  # examples:
  #   - "T1w"
  #   - "NMT2Sym:res-1"
  #   - "NMT2Sym:res-025"

anat:
  synthesis_level: "subject"  # str: T1w/T2w synthesis level ("subject", "session", "session_longitudinal").
  # "subject" = cross-session synthesis; one shared T1w per subject (cross-sectional)
  # "session" = within-session synthesis; each session reconstructed independently
  # "session_longitudinal" = like "session", plus a within-subject unbiased base
  #   template per subject and a base-seeded longitudinal surface reconstruction
  #   per session, so surfaces share one mesh across timepoints. Requires
  #   anat.surface_reconstruction.enabled and >=2 sessions with anatomy.
  conform:
    enabled: true  # HIGILY RECOMMENDED: bool: conform input image to template space using FLIRT rigid registration
  skullstripping_segmentation:
    enabled: true  # HIGILY RECOMMENDED: bool: perform brain extraction and segmentation
    method: "fastSurferCNN" 
    fastSurferCNN:
      gpu_device: "auto"  # int (>= -1) or "auto": GPU device ID (-1 = CPU, "auto" = auto-select)
      batch_size: 8  # int: batch size for inference (>= 1)
      plane_weight_coronal: 0.4  # float: weight for coronal plane (0.0-1.0)
      plane_weight_axial: 0.4  # float: weight for axial plane (0.0-1.0)
      plane_weight_sagittal: 0.2  # float: weight for sagittal plane (0.0-1.0)
      fix_V1_WM: true  # bool: fix missing thin WM in V1 by registering template V1 WM to individual space.
  bias_correction:
    enabled: true  # bool: perform bias field correction
    algorithm: "N4BiasFieldCorrection"  # str: bias correction algorithm (currently only "N4BiasFieldCorrection")
    shrink_factor: 2  # float: shrink factor for faster processing (> 0)
    bspline_fitting: 150  # int: N4 B-spline mesh resolution (ANTs -b), e.g. 150
    rescale_mean_to_100: true  # bool: rescale image mean intensity to 100
  surface_reconstruction:
    enabled: true  # bool: perform surface reconstruction
    use_t1wt2wcombined: false  # bool: use t1wt2wcombined image for surface recon if possible
    longitudinal:  # only used when anat.synthesis_level is "session_longitudinal"
      iscale: false  # bool: let mri_robust_template model intensity scaling between timepoints when building the base. Off matches FreeSurfer's rca-base-init, but each session's orig.mgz was rescaled by its own robust factor during conform, so the volumes being averaged are not on a common intensity scale
      subsample: null  # int or null: mri_robust_template --subsample threshold; escape hatch for large high-resolution volumes
      max_cbv_dist: 3.5  # float: how far a timepoint's surface may move from the base during placement (recon-all -long uses 3.5). Lower reduces across-timepoint variance but also damps genuine change, so it trades bias for variance
      pial_blend_weight: 0.25  # float (0.0-1.0): how far the longitudinal pial pass is blended toward this timepoint's own white surface (recon-all -long uses .25)
      time_column: null  # str or null: column in <bids_dir>/sub-XX/sub-XX_sessions.tsv holding each session's time, e.g. "age". null auto-detects "age" then "acq_time" (converted to days from the subject's first session). With no usable column the fitted rate is per scan rather than per unit time

func:
  coreg_runs_within_session: true
  conform:
    enabled: true  # HIGILY RECOMMENDED: bool: conform functional tmean image to target space using FLIRT rigid registration
  slice_timing_correction:
    enabled: true  # bool: perform slice timing correction
    repetition_time: null  # float: repetition time in seconds, or null (auto-detect from metadata)
    slice_timing: null  # list of floats: slice times in seconds, or null (auto-detect from metadata)
    tzero: null  # float: reference time point in seconds, or null (auto-calculate)
    slice_time_ref: 0.5  # float: reference slice time (0.0-1.0), 0.5 = middle slice
    slice_encoding_direction: null  # str: "x", "-x", "y", "-y", "z", "-z", or null (auto-detect from metadata)
  motion_correction:
    enabled: true  # bool: perform motion correction
    dof: 6  # int: degrees of freedom (6, 9, or 12)
    cost: "mutualinfo"  # str: cost function ("mutualinfo", "woods", "corratio", "normcorr", "normmi", "leastsq")
    smooth: 1.0  # float: smoothing factor for motion correction
    ref_vol: "mid"  # int or str: reference volume (integer index, "Tmean", or "mid")
    cost_tolerance: 0.01  # float: cost function tolerance
    parameter_tolerance: 0.01  # float: parameter tolerance
  despike:
    enabled: false  # bool: perform despiking (outlier removal)
    c1: 5  # float: first cutoff parameter (> 0, must be < c2)
    c2: 10  # float: second cutoff parameter (> 0, must be > c1)
    localedit: true  # bool: use local editing for despiking
    ignore_first_volumes: 0  # int: number of initial volumes to ignore (>= 0)
  confounds:  # regressors only; the BOLD image is never modified
    enabled: true  # bool: compute the confounds regressor TSV (motion-derived columns require func.motion_correction)
    fd_outlier_threshold_mm: 0.25  # float: FD above this flags motion_outlier## (macaque-scaled: human 0.5mm x 27/50 brain-radius ratio)
    std_dvars_outlier_threshold: 1.5  # float: standardized DVARS above this flags motion_outlier## (dimensionless / species-independent)
    fd_radius_mm: 27.0  # float: sphere radius converting rotations to mm for framewise_displacement and rmsd (macaque head; > 0). FD values and fd_outlier_threshold_mm are only comparable at a fixed radius
  bias_correction:  # only done on tmean image for better registration, not on the functional images directly
    enabled: true  # bool: perform bias field correction
    algorithm: "N4BiasFieldCorrection"  # str: bias correction algorithm (currently only "N4BiasFieldCorrection")
    shrink_factor: 2  # float: shrink factor for faster processing (> 0)
    bspline_fitting: 100  # int: N4 B-spline mesh resolution (ANTs -b), e.g. 100
    rescale_mean_to_100: true  # bool: rescale image mean intensity to 100
  skullstripping:
    enabled: true  # HIGILY RECOMMENDED: bool: perform brain extraction

registration:
  anat2template_xfm_type: "syn"  # str: transform type for anat->template ("translation", "rigid", "affine", or "syn")
  func2anat_xfm_type: "syn"  # str: transform type for func->anat ("translation", "rigid", "affine", or "syn")
  func2template_xfm_type: "syn"  # str: transform type for func->template ("translation", "rigid", "affine", or "syn")
  interpolation: "BSpline"  # str: interpolation method ("Linear", "NearestNeighbor", "MultiLabel", "Gaussian", "BSpline", "CosineWindowedSinc", "WelchWindowedSinc", "HammingWindowedSinc", "LanczosWindowedSinc", "GenericLabel")
  enable_fireants: true  # bool: use FireANTs for syn registration if available, otherwise use ANTs
  keep_func_resolution: true  # bool: keep original functional image resolution after registration