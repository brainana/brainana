[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# This file drives "uv pip install -e ." and defines the package and its dependencies.

[project]
name = "brainana"
version = "2.1.0"
description = "A Python package for preprocessing and registration of macaque neuroimaging data with BIDS dataset support"
readme = { file = "README.md", content-type = "text/markdown" }
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
authors = [
    {name = "Xingyu Liu", email = "liuxingyu987@gmail.com"},
    {name = "Michael Arcaro", email = "marcaro@sas.upenn.edu"},
]
keywords = [
    "neuroimaging",
    "mri",
    "macaque",
    "bids",
    "preprocessing",
    "registration",
    "freesurfer",
    "fastsurfer",

]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

dependencies = [
    # Core neuroimaging and scientific computing
    "nibabel>=5.3.2",
    "numpy>=2.3.0",
    "scipy>=1.15.3",
    "matplotlib>=3.10.3",
    "pandas>=2.3.0",
    "packaging>=20.0",
    # PyTorch for fastsurfer_nn models (>=2.3 for FireANTs compatibility)
    "torch>=2.3.0",
    "torchvision>=0.15.0",
    "torchio>=0.18.0",
    # Image processing (SimpleITK >=2.3 for FireANTs compatibility; 2.2.1 not on PyPI for all platforms)
    "Pillow>=8.0.0",
    "scikit-image>=0.20.0",
    "SimpleITK>=2.3.0",
    # FireANTs for GPU-accelerated registration (pinned; v1.5.0 provides the API brainana imports)
    "fireants==1.5.0",
    # fastsurfer_nn dependencies
    "yacs>=0.1.8",
    "h5py>=3.8.0",
    # fastsurfer_surfrecon dependencies
    "pydantic>=2.0.0",
    "lapy>=1.0.0",
    # pymeshfix: used via its array API only (PyTMesh), never via a pyvista mesh.
    # Floor is 0.18.1, not 0.16: in 0.18.0 MeshFix.__init__ probes
    # find_spec("pyvista.core") *before* dispatching on array input, and that
    # RAISES ModuleNotFoundError rather than returning None when pyvista is
    # absent. pyvista is only a `pymeshfix[extras]` dependency, so no resolver
    # installs it for us -- meaning the old floor described a version that
    # could not work. Guarded by tests/surfrecon/test_topology_fix.py, which
    # performs a real repair rather than merely importing the package.
    "pymeshfix>=0.18.1",
    # Utilities
    "tqdm>=4.67.1",
    "pyyaml>=6.0",
    "requests>=2.31.0",
]
# Note: tomli not needed since requires-python >= 3.11 (has built-in tomllib)
# Removed from core: joblib, typer, rich -- verified unused: no module-scope import
# in src/, AND no transitive *runtime* need. Both halves matter.
#
# WARNING to future edits: `grep "import <pkg>" src/` is NOT sufficient evidence that a
# dependency is unused. pyvista was removed from this list on 2026-06-02 on exactly that
# evidence and silently broke surface topology repair for 55 days, because pyvista is a
# call-time need of pymeshfix rather than an import of ours. tensorboard was removed in
# the same commit for the same reason and hotfixed 20 minutes later (it is reached via
# torch.utils.tensorboard). Before removing a dependency, run the `Dependencies` workflow,
# which installs for real -- docs.yml installs with --no-deps and can never catch this.
# See tests/test_dependency_declarations.py and tests/surfrecon/test_topology_fix.py.
# tensorboard is training-only (fastsurfer_nn/training/trainer.py, guarded import) -> moved to [train].
# Moved to optional extras (not on the anatomical/lite import path): pybids -> [func];
# scikit-learn, seaborn -> [train]; surfplot -> [surf]; psutil -> [full] (guarded/optional
# resource reporting in environment.py — degrades gracefully when absent, e.g. in lite).
# The full preprocessing pipeline pulls the runtime extras via [full].

[project.optional-dependencies]
# Lightweight extra for the "lite" notebook: provides the ANTs operations via the antspyx
# Python API, so no ANTs command-line install is needed (e.g. on Colab). The ops auto-fall
# back to antspyx only when the ANTs CLI is absent; the full pipeline never installs this.
lite = [
    # Floor, not bare: antspyx 0.6.x caps scipy<1.16 and numpy<2.4, and brainana floors both
    # unbounded. Left bare, the resolver prefers the newest scipy and backtracks antspyx to
    # 0.5.3 -- the last release without that cap, and the last without a cp313 wheel. On
    # Python 3.13 (which Colab now runs) that silently becomes an ITK source build: tens of
    # minutes, frequently an OOM. 0.6.0 is the first release with cp313 wheels.
    # Cost of the floor, measured: scipy moves 1.16.0 -> 1.15.3 in uv.lock. Nothing else.
    "antspyx>=0.6.3",
]
# Surface-reconstruction acceleration: scikit-sparse (CHOLMOD) speeds up the spherical
# projection in fastsurfer_surfrecon. It is OPTIONAL — the code falls back to a non-CHOLMOD
# solver when it is absent (see fastsurfer_surfrecon/processing/spherical.py). It is NOT in
# core deps because it has no wheels and must compile against SuiteSparse, which breaks on
# hosts without it (e.g. the lite venv). The full pipeline installs it via the `surf` extra.
# Cap below 0.5: scikit-sparse 0.5.x requires the newer SuiteSparse 7.x (single-precision
# CHOLMOD); 0.4.x builds against both the common SuiteSparse 5.x (Ubuntu 22.04, Colab) and 7.x.
surf = [
    "scikit-sparse>=0.4.0,<0.5",
    # surfplot: surface QC snapshots (imported under try/except in quality_control; never on the lite path)
    "surfplot>=0.2.0",
]
# Functional pipeline: BIDS discovery (pybids) — used by steps/bids_discovery.py, not by lite.
func = [
    "pybids>=0.15.0",
]
# Model training / dev analysis ONLY (nhp_skullstrip_nn/fastsurfer_nn training, helper scripts).
# NOT installed in the Docker pipeline image — the deployed image only preprocesses.
train = [
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
    # tensorboard: training-only run logging (torch.utils.tensorboard in fastsurfer_nn/training/trainer.py).
    # The import there is guarded, so inference/lite work without it; training needs it installed.
    "tensorboard>=2.0.0",
    # psutil: ALSO declared in [full] for the guarded resource report in environment.py.
    # Declared here too because training data prep imports it UNGUARDED at module scope
    # (fastsurfer_nn/training/step2_create_hdf5.py, nhp_skullstrip_nn/train/step2_create_hdf5.py),
    # and [full] deliberately excludes [train] -- so [train] must be self-sufficient.
    "psutil>=5.0.0",
]
# Full preprocessing pipeline runtime (the Nextflow/Docker image installs this): surfaces +
# functional/BIDS + optional resource reporting. Deliberately EXCLUDES [train] (training-only).
full = [
    "brainana[surf]",
    "brainana[func]",
    "psutil>=5.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "nilearn>=0.10.0",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-copybutton>=0.5.0",
    "sphinxcontrib-mermaid>=0.9",
    "sphinxext-opengraph>=0.9",
]

# System dependencies (not Python packages): Connectome Workbench (wb_command) for QC surface snapshots
# Install: apt install connectome-workbench (Debian/Ubuntu) or see https://humanconnectome.org/software/connectome-workbench

[project.urls]
Homepage = "https://github.com/xingyu-liu/brainana"
Documentation = "https://brainana.readthedocs.io"
Repository = "https://github.com/xingyu-liu/brainana"

[tool.uv]
# fireants 1.5.0 hard-pins simpleitk==2.2.1, which isn't on PyPI for all platforms.
# brainana standardizes on SimpleITK>=2.3.0 (verified working with fireants 1.5.0),
# so override the transitive pin to let uv resolve. See the SimpleITK dependency note above.
override-dependencies = ["simpleitk>=2.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nhp_mri_prep*", "fastsurfer_nn*", "fastsurfer_surfrecon*", "nhp_skullstrip_nn*"]

[tool.setuptools.package-data]
"nhp_mri_prep" = [
    "config/*.yaml",
    "config/*.html",
    "quality_control/resources/*.scene",
]
"fastsurfer_nn" = [
    "config/*.yaml",
    "atlas/**/*",
    "pretrained_model/*.pkl",
]
"fastsurfer_surfrecon" = [
    "config/*.yaml",
    "atlas/**/*",
]
"nhp_skullstrip_nn" = [
    "config/*.yaml",
    "pretrained_model/*.pth",
]

[tool.ruff]
target-version = "py311"
# Throwaway dev/debug scripts are not held to lint/format standards.
extend-exclude = ["scripts/scratch"]

[tool.ruff.lint.per-file-ignores]
# Notebooks run setup (paths, installs) before imports in later cells, and
# define config vars (e.g. USE_GPU) across cells that per-cell analysis can't see.
"scripts/*.ipynb" = ["E402"]
"examples/*.ipynb" = ["E402", "F821"]
"src/**/training/**/*.py" = ["E402"]
"src/**/train/**/*.py" = ["E402"]
"src/**/nextflow_scripts/**/*.py" = ["E402"]
# Edit-the-source dev drivers, grouped by the package they drive. They prepend src/
# before importing and keep demo/optional imports around, so import-ordering and
# unused-import rules do not apply. No equivalent exemption exists for src/** any
# more: everything of this shape has been moved here, and the only scripts left in
# the package tree (nhp_skullstrip_nn/scripts/) are a real argparse CLI.
"scripts/dev/**/*.py" = ["E402", "F401", "F541"]

[tool.black]
extend-exclude = "scripts/scratch"
